 <head>

  <title>Wedding Invitation</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&amp;family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&amp;family=Raleway:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <style>
        :root {
            --ivory: #FFFEF7;
            --beige: #F5F0E8;
            --champagne: #F7E7CE;
            --dusty-rose: #DCAE96;
            --taupe: #8B7D6B;
            --gold: #C9A96E;
            --gold-light: #E8D5A3;
            --dark: #3D3229;
        }
        body { font-family: 'Libre Baskerville', serif; background: var(--ivory); color: var(--dark); overflow-x: hidden; }
        .script-font { font-family: 'Playfair Display', serif; }
        .clean-font { font-family: 'Raleway', sans-serif; }

        /* Envelope Animation */
        .envelope-overlay {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, var(--beige), var(--champagne));
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        .envelope-overlay.hidden-anim { opacity: 0; visibility: hidden; pointer-events: none; }
        .envelope {
            width: 320px; height: 220px; position: relative; cursor: pointer;
            perspective: 800px;
        }
        .envelope-body {
            width: 100%; height: 100%; background: linear-gradient(145deg, #f9f3e8, #efe6d5);
            border-radius: 8px; box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            position: relative; overflow: hidden;
        }
        .envelope-flap {
            position: absolute; top: 0; left: 0; right: 0; height: 50%;
            background: linear-gradient(180deg, #efe6d5, #e8dcc8);
            clip-path: polygon(0 0, 50% 100%, 100% 0);
            transform-origin: top center;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2;
        }
        .envelope.opened .envelope-flap { transform: rotateX(180deg); }
        .envelope-light {
            position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
            width: 200px; height: 200px;
            background: radial-gradient(circle, rgba(249,215,126,0.6) 0%, transparent 70%);
            opacity: 0; transition: opacity 0.6s ease 0.4s;
        }
        .envelope.opened .envelope-light { opacity: 1; }
        .invitation-card {
            position: absolute; bottom: 10%; left: 50%; transform: translateX(-50%) translateY(100%);
            width: 260px; height: 160px; background: white;
            border-radius: 6px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 4px;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.5s;
            border: 1px solid var(--gold-light);
        }
        .envelope.opened .invitation-card { transform: translateX(-50%) translateY(-20%); }
        .open-text {
            position: absolute; bottom: -50px; left: 50%; transform: translateX(-50%);
            white-space: nowrap; opacity: 0.7;
        }

        /* Hero */
        .hero-section {
            position: relative; width: 100%;
            height: calc(100 * min(var(--vh, 1vh), 1vh));
            overflow: hidden;
        }
        .hero-slide {
            position: absolute; inset: 0; opacity: 0;
            transition: opacity 1.5s ease;
        }
        .hero-slide.active { opacity: 1; }
        .hero-slide img { width: 100%; height: 100%; object-fit: cover; }
        .hero-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to bottom, rgba(61,50,41,0.2) 0%, rgba(61,50,41,0.5) 60%, rgba(61,50,41,0.7) 100%);
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; text-align: center; padding: 2rem;
        }

        /* Animations */
        .fade-up {
            opacity: 0; transform: translateY(40px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        .fade-up.visible { opacity: 1; transform: translateY(0); }

        /* Gallery editorial */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: repeat(4, 180px);
            gap: 12px;
        }
        .gallery-grid .g1 { grid-column: 1/6; grid-row: 1/3; }
        .gallery-grid .g2 { grid-column: 6/10; grid-row: 1/2; }
        .gallery-grid .g3 { grid-column: 10/13; grid-row: 1/3; }
        .gallery-grid .g4 { grid-column: 6/10; grid-row: 2/4; }
        .gallery-grid .g5 { grid-column: 1/5; grid-row: 3/5; }
        .gallery-grid .g6 { grid-column: 5/13; grid-row: 4/5; }
        .gallery-grid img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; transition: transform 0.5s ease; }
        .gallery-grid img:hover { transform: scale(1.03); }

        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto;
            }
            .gallery-grid .g1,.gallery-grid .g2,.gallery-grid .g3,.gallery-grid .g4,.gallery-grid .g5,.gallery-grid .g6 {
                grid-column: auto; grid-row: auto;
            }
            .gallery-grid img { height: 200px; }
        }

        /* Petals */
        .petal {
            position: fixed; pointer-events: none; z-index: 100;
            width: 12px; height: 12px; opacity: 0.6;
            background: var(--dusty-rose);
            border-radius: 50% 0 50% 50%;
            animation: petalFall linear infinite;
        }
        @keyframes petalFall {
            0% { transform: translateY(-20px) rotate(0deg) translateX(0); opacity: 0.7; }
            50% { transform: translateY(50vh) rotate(180deg) translateX(30px); }
            100% { transform: translateY(100vh) rotate(360deg) translateX(-20px); opacity: 0; }
        }

        /* Timeline */
        .timeline-line {
            position: absolute; left: 50%; top: 0; bottom: 0; width: 2px;
            background: linear-gradient(to bottom, var(--gold-light), var(--dusty-rose));
            transform: translateX(-50%);
        }
        @media (max-width: 768px) {
            .timeline-line { left: 20px; }
        }

        /* Divider */
        .ornament { display: flex; align-items: center; justify-content: center; gap: 12px; }
        .ornament::before, .ornament::after {
            content: ''; width: 60px; height: 1px; background: var(--gold);
        }

        .section-padding { padding: 80px 24px; }
        @media (max-width: 768px) { .section-padding { padding: 60px 16px; } }
    </style>

  <script>
        // Envelope
        function openEnvelope() {
            document.getElementById('envelope').classList.add('opened');
            setTimeout(() => {
                document.getElementById('envelope-overlay').classList.add('hidden-anim');
            }, 2000);
        }

        // Hero carousel
        let currentSlide = 0;
        const slides = document.querySelectorAll('.hero-slide');
        setInterval(() => {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }, 5000);

        // Scroll animations
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
        }, { threshold: 0.15 });
        document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));

        // RSVP form
        document.getElementById('rsvp-form').addEventListener('submit', (e) => {
            e.preventDefault();
            document.getElementById('rsvp-form').classList.add('hidden');
            document.getElementById('rsvp-success').classList.remove('hidden');
        });

        // Floating petals
        function createPetal() {
            const petal = document.createElement('div');
            petal.className = 'petal';
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.animationDuration = (4 + Math.random() * 4) + 's';
            petal.style.animationDelay = Math.random() * 2 + 's';
            document.getElementById('petals-container').appendChild(petal);
            setTimeout(() => petal.remove(), 8000);
        }
        setInterval(createPetal, 1500);

        lucide.createIcons();
    </script>
