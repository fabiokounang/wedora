<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="t19bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf8f0"/>
      <stop offset="100%" stop-color="#efe0c8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#t19bg)"/>
  <!-- Glass card -->
  <rect x="120" y="50" width="160" height="200" rx="18" fill="rgba(255,255,255,0.6)" stroke="rgba(255,255,255,0.7)" stroke-width="1"/>
  <!-- Emoji ornaments -->
  <text x="60" y="90" font-size="20"><8</text>
  <text x="310" y="90" font-size="18"><:</text>
  <text x="60" y="230" font-size="18"><C</text>
  <text x="310" y="230" font-size="20"><7</text>
  <!-- Eyebrow -->
  <text x="200" y="104" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#7a6a54" letter-spacing="3">YOU ARE INVITED</text>
  <!-- Couple names (script style) -->
  <text x="200" y="148" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-style="italic" fill="#3a2e22">Amelia &amp; James</text>
  <!-- Gold divider -->
  <line x1="170" y1="160" x2="230" y2="160" stroke="#c9a87a" stroke-width="0.8" opacity="0.8"/>
  <!-- Date -->
  <text x="200" y="178" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#7a6a54" letter-spacing="2">JUNE 15 � 2025</text>
  <!-- Open button -->
  <rect x="165" y="196" width="70" height="20" rx="10" fill="none" stroke="#c9a87a" stroke-width="1.2"/>
  <text x="200" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="7.5" fill="#c9a87a" letter-spacing="1">OPEN</text>
  <!-- Label -->
  <text x="200" y="272" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#7a6a54">Glass Elegance</text>
</svg>
