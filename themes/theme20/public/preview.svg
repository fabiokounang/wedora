<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="t20bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0500"/>
      <stop offset="100%" stop-color="#2a1008"/>
    </linearGradient>
    <radialGradient id="t20glow" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#c43010" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#t20bg)"/>
  <rect width="400" height="300" fill="url(#t20glow)"/>
  <!-- Lanterns -->
  <rect x="40" y="18" width="18" height="26" rx="3" fill="#e8a030" opacity="0.8"/>
  <line x1="49" y1="10" x2="49" y2="18" stroke="#d44000" stroke-width="1.5"/>
  <rect x="80" y="10" width="16" height="22" rx="3" fill="#c43010" opacity="0.7"/>
  <line x1="88" y1="3" x2="88" y2="10" stroke="#a02000" stroke-width="1.5"/>
  <rect x="330" y="15" width="18" height="26" rx="3" fill="#e8a030" opacity="0.8"/>
  <line x1="339" y1="7" x2="339" y2="15" stroke="#d44000" stroke-width="1.5"/>
  <!-- Flame card -->
  <rect x="110" y="60" width="180" height="185" rx="6" fill="rgba(42,26,16,0.9)" stroke="rgba(196,48,16,0.4)" stroke-width="1"/>
  <!-- Eyebrow -->
  <text x="200" y="96" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#a08060" letter-spacing="3">YOU ARE INVITED</text>
  <!-- Names -->
  <text x="200" y="133" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#f4c860">Amelia &amp; James</text>
  <!-- Ember divider -->
  <line x1="162" y1="143" x2="238" y2="143" stroke="#e87030" stroke-width="0.8" opacity="0.7"/>
  <!-- Date -->
  <text x="200" y="160" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#a08060" letter-spacing="2">JUNE 15 � 2025</text>
  <!-- Open button -->
  <rect x="160" y="178" width="80" height="24" rx="3" fill="none" stroke="#e87030" stroke-width="1.2"/>
  <text x="200" y="194" text-anchor="middle" font-family="Arial,sans-serif" font-size="7.5" fill="#f4c860" letter-spacing="1">OPEN INVITATION</text>
  <!-- Ember particles -->
  <circle cx="130" cy="260" r="2" fill="#f4c860" opacity="0.6"/>
  <circle cx="160" cy="250" r="1.5" fill="#e87030" opacity="0.5"/>
  <circle cx="250" cy="255" r="2" fill="#f4c860" opacity="0.7"/>
  <circle cx="290" cy="245" r="1.5" fill="#e87030" opacity="0.5"/>
  <!-- Label -->
  <text x="200" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#a08060">Flame Spirit</text>
</svg>
